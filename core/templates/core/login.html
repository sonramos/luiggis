{% extends 'core/base.html' %}

{% block title %}Entrar{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <h3 class="card-title">Entrar</h3>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.errors %}
      <div class="alert alert-danger">Verifique os dados e tente novamente.</div>
      {% endif %}

      <div class="mb-3">
        <label for="id_username" class="form-label">Usuário</label>
        {{ form.username }}
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">Senha</label>
        {{ form.password }}
      </div>

      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
