{% extends 'core/base.html' %}

{% block title %}Entrar{% endblock %}

{% block content %}
<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
    }

    .card {
        width: 100%;
        max-width: 400px;
        border: none;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        background-color: #fff;
    }

    .card-title {
        font-weight: bold;
        color: #333;
        margin-bottom: 1.5rem;
        text-align: center;
    }

    input[type="text"], 
    input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
    }

    .btn-primary {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
        margin-top: 10px;
    }

    .btn-primary:hover {
        background-color: #0056b3;
    }

    .alert-danger {
        background-color: #f8d7da;
        color: #721c24;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        font-size: 0.9rem;
        border: 1px solid #f5c6cb;
    }

    /* Estilo para o link de cadastro */
    .register-link {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid #eee;
        font-size: 0.9rem;
        color: #666;
    }

    .register-link a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
    }

    .register-link a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-wrapper">
    <div class="card">
        <div class="card-body" style="padding: 2rem;">
            <h3 class="card-title">Entrar</h3>
            
            <form method="post" novalidate>
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="alert alert-danger">Usuário ou senha inválidos.</div>
                {% endif %}

                <div class="mb-3">
                    <label for="id_username" class="form-label">Usuário</label>
                    {{ form.username }}
                </div>
                
                <div class="mb-3">
                    <label for="id_password" class="form-label">Senha</label>
                    {{ form.password }}
                </div>

                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <div class="register-link">
                Ainda não tem uma conta? <br>
                <a href="/accounts/register/">Ou faça cadastro aqui</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
